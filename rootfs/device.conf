# Tab P11: the panel scans out portrait; the shell's landscape is 270.
transform_offset=270
# A double tap on the dark screen turns it on; from sleep the touch chip's
# gesture mode wakes the tablet (novatek,double-tap-wake in the DTS).
double_tap_wake=1
# No system sleep yet: in s2idle the ADSP's sensor process crashes and the
# ADSP, sound included, does not come back (issue). The screen only goes off.
suspend=no
