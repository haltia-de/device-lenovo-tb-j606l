# Four AW88258 speaker amplifiers behind the LPASS primary MI2S port
# (MultiMedia1 -> PRI_MI2S_RX). Left speakers play left, right ones right.
# The microphones come from the DBMD8 voice processor (haltia-dbmd8) on the
# secondary MI2S port (SEC_MI2S_TX -> MultiMedia2).
SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer SEC_MI2S_TX' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
		cset "name='MultiMedia2 Mixer SEC_MI2S_TX' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Mic" {
	Comment "Microphones"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}
}
