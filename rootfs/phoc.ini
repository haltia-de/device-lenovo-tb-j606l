# phoc for the TB-J606L. The panel scans out portrait (1200x2000); the
# tablet is held landscape, so the picture turns by 90 degrees. The output
# is DSI-1 under the MSM display driver, Unknown-1 under simpledrm.
[output:DSI-1]
rotate = 90
# The MSM driver reports the real 143x235 mm panel and phoc would pick
# scale 2; the shared shell is laid out for scale 1 at this size.
scale = 1

[output:Unknown-1]
rotate = 90
